{
  "project": {
    "dataset_dir": "dataset",
    "output_dir": "processed",
    "task": "Rest"
  },
  "filter": {
    "l_freq": 1.0,
    "h_freq": 100.0,
    "method": "fir",
    "phase": "zero",
    "notch_enabled": true,
    "notch_freq_hz": 60.0,
    "notch_width_hz": 2.0,
    "reason": "The retained 1-100 Hz band includes the 60 Hz line frequency, so notch filtering is applied before resampling."
  },
  "resampling": {
    "target_sfreq": 250.0,
    "method": "fft",
    "npad": "auto"
  },
  "channels": {
