      "Resp",
      "X",
      "Y",
      "Z"
    ],
    "flat_std_uv": 0.1,
    "metric_robust_z": 6.0,
    "correlation_robust_z": 6.0,
    "minimum_independent_flags": 2,
    "minimum_median_correlation": -0.2
  },
  "artifacts": {
    "window_sec": 1.0,
    "step_sec": 0.5,
    "absolute_peak_to_peak_uv": 500.0,
    "global_peak_to_peak_robust_z": 10.0,
    "minimum_global_peak_to_peak_uv": 100.0,
    "padding_sec": 0.25,
    "merge_gap_sec": 0.25
  },
  "ica": {
    "method": "infomax",
    "extended": true,
    "n_components": 0.99,
    "random_state": 42,
    "max_iter": 1000,
    "fit_l_freq": 1.0,
    "fit_h_freq": 100.0,
    "temporary_resample_sfreq": 250.0,
    "suggestion_frontal_correlation": 0.3,
    "suggestion_frontal_weight_ratio": 1.5,
    "iclabel_enabled": true,
    "iclabel_backend": "onnx",
    "iclabel_artifact_probability_threshold": 0.6,
    "iclabel_minimum_class_probability": 0.3,
    "manual_exclude_components": {},
    "manual_exclude_reasons": {},
    "manual_review_confirmed": {},
    "automatic_exclude_components": {},
    "automatic_exclude_reasons": {}
  },
  "epochs": {
    "duration_sec": 4.0,
    "overlap_sec": 0.0,
    "peak_to_peak_uv": 200.0,
    "robust_z": 8.0,
    "baseline": null,
    "autoreject_enabled": false
  },
  "qc": {
    "preferred_channels": [
      "Fp1",
      "Fz",
      "Cz",
      "CPz",
      "Pz",
      "O1"
    ],
    "trace_start_sec": 20.0,
    "trace_duration_sec": 10.0,
    "psd_fmin_hz": 1.0,
    "psd_fmax_hz": 100.0,
    "final_psd_fmax_hz": 100.0,
    "dpi": 150,
    "ica_components_per_page": 12
